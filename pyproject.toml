[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loyal-wingman"
version = "0.1.0"
description = "Offload menial coding-agent tasks to a local LLM, and teach it not to repeat mistakes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Bryan Alexander Buchorn" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BrutalByte/loyal-wingman"

[project.scripts]
loyal-wingman = "loyal_wingman.cli:main"

[tool.setuptools]
packages = ["loyal_wingman"]
